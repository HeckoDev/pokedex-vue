<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokédex</title>
    <style>
      html, body { margin: 0; background: #0b1220; }
      #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
      #boot .ball { width: 88px; height: 88px; border-radius: 50%; position: relative; overflow: hidden;
        background: linear-gradient(#e53935 0 46%, #111 46% 54%, #f5f5f5 54%);
        box-shadow: 0 8px 24px rgba(0,0,0,.5); animation: boot-spin 1.1s linear infinite; }
      #boot .ball::after { content: ""; position: absolute; left: 50%; top: 50%; width: 26px; height: 26px;
        margin: -13px 0 0 -13px; border-radius: 50%; background: #f5f5f5; border: 5px solid #111; box-sizing: border-box; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #boot .ball { animation: none; } }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="boot" role="status" aria-label="Chargement">
        <div class="ball" aria-hidden="true"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
